[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "saw_map"
version = "0.1.0"
description = "Soldiers at War Original Map and Asset Visualizer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arcade>=3.3.1",
    "pillow>=10.2.0",
    "pygame>=2.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
]

[project.scripts]
saw-map = "saw_map.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
